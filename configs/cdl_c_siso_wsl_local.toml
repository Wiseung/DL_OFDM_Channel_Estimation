[experiment]
name = "cdl_c_siso_baseline_wsl_local"
seed = 1234
backend = "sionna"
device = "auto"

[radio]
num_subcarriers = 256
num_ofdm_symbols = 14
pilot_ofdm_symbol_indices = [2, 11]
pilot_pattern = "kronecker"
num_tx = 1
num_streams_per_tx = 1
modulation = "qpsk"
num_bits_per_symbol = 2
channel_model = "CDL-C"
delay_spread_s = 1e-7
speed_m_per_s = 10.0
carrier_frequency_hz = 3.5e9
subcarrier_spacing_hz = 15000.0

[dataset]
output_dir = "/home/wiseung/ofdm_channel_estimation_runs/cdl_c_siso_baseline/datasets"
train_shards = 8
val_shards = 2
test_shards = 2
samples_per_shard = 256
train_snr_min_db = 0.0
train_snr_max_db = 20.0
val_snr_db = 10.0
test_snr_db = 10.0

[model]
in_channels = 2
base_channels = 64
num_res_blocks = 8

[training]
batch_size = 64
epochs = 50
learning_rate = 0.001
weight_decay = 0.0001
amp = true
early_stopping_patience = 8
num_workers = 4
checkpoint_dir = "/home/wiseung/ofdm_channel_estimation_runs/cdl_c_siso_baseline/checkpoints"
log_every_steps = 20

[evaluation]
snr_db = [0.0, 5.0, 10.0, 15.0, 20.0]
batches_per_snr = 8
batch_size = 64
output_dir = "/home/wiseung/ofdm_channel_estimation_runs/cdl_c_siso_baseline/eval"
