[experiment]
name = "mimo_2x2_baseline_wsl_local"
seed = 1234
backend = "sionna"
device = "auto"

[radio]
num_subcarriers = 256
num_ofdm_symbols = 14
pilot_ofdm_symbol_indices = [2, 11]
pilot_pattern = "kronecker"
num_tx = 1
num_streams_per_tx = 2
num_tx_ant = 2
num_rx_ant = 2
modulation = "qpsk"
num_bits_per_symbol = 2
channel_model = "TDL-C"
delay_spread_s = 1e-7
speed_m_per_s = 10.0
carrier_frequency_hz = 3.5e9
subcarrier_spacing_hz = 15000.0

[dataset]
output_dir = "/home/wiseung/ofdm_channel_estimation_runs/mimo_2x2_baseline/datasets"
train_shards = 8
val_shards = 2
test_shards = 2
samples_per_shard = 256
train_snr_min_db = 0.0
train_snr_max_db = 20.0
val_snr_db = 10.0
test_snr_db = 10.0

[model]
architecture = "mimo_factorized"
in_channels = 8
out_channels = 8
base_channels = 64
num_res_blocks = 8
link_channels = 24
mix_channels = 96
per_link_res_blocks = 2
cross_res_blocks = 4
refine_res_blocks = 1

[training]
batch_size = 64
epochs = 50
learning_rate = 0.001
weight_decay = 0.0001
amp = true
early_stopping_patience = 8
num_workers = 0
checkpoint_dir = "/home/wiseung/ofdm_channel_estimation_runs/mimo_2x2_baseline/checkpoints"
log_every_steps = 20

[evaluation]
snr_db = [0.0, 5.0, 10.0, 15.0, 20.0]
batches_per_snr = 8
batch_size = 64
output_dir = "/home/wiseung/ofdm_channel_estimation_runs/mimo_2x2_baseline/eval"
